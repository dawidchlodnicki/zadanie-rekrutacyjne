<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="c-top">
    <span class="c-brand">Zadanie rekrutacyjne</span>
    <nav class="tabs"><a href="#cr" data-tab="cr">Code review</a><a href="#sd" data-tab="sd">System design</a></nav>
  </header>
  <main class="c-main" id="content"></main>
  <script src="candidate-data.js"></script>
  <script src="diff.js"></script>
  <script>
    (function () {
      const { codeReview: cr, systemDesign: sd } = window.CANDIDATE_VIEW;
      const { renderDiff, renderBrief, escapeHtml } = window.DiffView;
      const content = document.getElementById('content');
      let observer;

      function systemDesign() {
        return `<article class="c-sd"><div class="eyebrow">System design</div><h1>${escapeHtml(sd.title)}</h1>
          ${sd.description.map((p) => `<p>${escapeHtml(p)}</p>`).join('')}
          <span class="label">Zadanie</span><p class="sd-task">${escapeHtml(sd.task)}</p></article>`;
      }

      function codeReview() {
        const brief = renderBrief(cr);
        return `<div class="c-cr">${brief.todo}<aside class="c-side">${brief.ticket}${brief.pr}</aside><div class="c-diff">${renderDiff(cr.files)}</div></div>`;
      }

      function trackFiles() {
        const sections = [...content.querySelectorAll('.d-file')];
        const links = [...content.querySelectorAll('.b-files [data-file]')];
        const visible = new Set();
        observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) visible.add(entry.target);
            else visible.delete(entry.target);
          }
          const current = sections.find((x) => visible.has(x));
          links.forEach((link) => link.classList.toggle('on', current?.id === `file-${link.dataset.file}`));
        }, { rootMargin: '-72px 0px -55% 0px' });
        sections.forEach((x) => observer.observe(x));
      }

      function render() {
        const tab = location.hash === '#sd' ? 'sd' : 'cr';
        observer?.disconnect();
        document.querySelectorAll('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab));
        document.title = tab === 'sd' ? 'System design' : 'Code review';
        content.innerHTML = tab === 'sd' ? systemDesign() : codeReview();
        if (tab === 'cr') trackFiles();
        window.scrollTo(0, 0);
      }

      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
</body>
</html>
